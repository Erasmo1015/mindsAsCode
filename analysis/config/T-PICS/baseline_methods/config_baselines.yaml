# PICS v3 g5e50p30 baseline paths (LM / PT / Centaur).
#
# Participant table = analysis/config/teh_datasets.yaml (first 30 of the
# historical 50-person table). Exceptions: Speekenbrink 0-22, Badham 0-9,
# Wulff 1290-1319. Equal-person means over those people only.
#
# Empty string = missing or invalid (needs a new run). Do not use discarded
# 3090 jobs (Speekenbrink v1 backup; mixed −2.004; Kool v1 6/50).
#
# LM / PT: per-person scores already existed except Bergert PT, which was
# rerun under structure_aware_v3 for ordinals 0-29. Other dirs are 30-person
# slices (independent per-person fits, so the slice equals re-eval).
#   independents / resetting — SA40 v1 job_253730_* (v2/v3: skip LM/PT rerun)
#   Speekenbrink + Kool — SA40 v3 job_259085_v3
#   Bergert PT — SA40 v3 job_g5e50p30 (chance ln 0.5; cue-count-balanced pairs)
#
# Centaur: 3090 README is the contract.
#   paper_keep SA40 (prefixes match v3): Bergert, Guan, Steyvers, Schulz,
#     Hilbig, Enkavi, mixed A/B fix
#   missing on 3090 → origami full-data (test membership unchanged vs SA40/v3):
#     Peterson, Plonsky, CCT, Wulff, Frey Risk, Badham
#   Speekenbrink / Kool: 3090 v3 reruns OOMed (chance); v1 Speekenbrink backup
#     has the wrong test histories — leave empty
#
# Slice CSVs: analysis/config/T-PICS/baseline_methods/g5e50p30/<method>/<dataset>/
# Provenance notes (not for git): generated_outputs/psych101_train/centaur/2026Sep/g5e50p30/

protocol: structure_aware_v3
limited_train_val: 40
split_ratio: 0.6
split_seed: 0
ordinals: analysis/config/teh_datasets.yaml

datasets:
  1peterson2021using:  # Choice13k  0-29
    MLE: analysis/config/T-PICS/baseline_methods/g5e50p30/MLE/1peterson2021using
    prospect_theory: analysis/config/T-PICS/baseline_methods/g5e50p30/prospect_theory/1peterson2021using
    Centaur: analysis/config/T-PICS/baseline_methods/g5e50p30/Centaur/1peterson2021using

