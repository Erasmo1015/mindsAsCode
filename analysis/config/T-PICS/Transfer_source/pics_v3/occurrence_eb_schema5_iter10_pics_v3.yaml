selector:
  name: occurrence_eb_schema5_iter10_pics_v3
  method: hierarchical_motif_occurrence_eb_cosine
  estimator: empirical_bayes_logit_random_intercept
  equation: X_dje ~ Bern(p_de); logit(p_de)=alpha_e + b_de, b~N(0,tau_e^2)
  smoothing: Jeffreys p=(k+0.5)/(n+1); alpha=logit(overall Jeffreys)
  signature: invlogit(alpha_e + b_hat_{d,e}) per motif
  selection_rule: argmax cosine among six-source allowlist; self excluded; lexicographic source-id tie-break
  iteration_prefix: 1-10
  iteration_prefix_note: Full 10 source-population iterations; structure_aware_v3 / pics_v3_g1 / g5e50p30.
  schema_version: 5
  limited_data_protocol: structure_aware_v3
  run_tag: g5e50p30_occurrence_eb_pics_v3
  motifs:
  - history
  - value
  - probability_used
  - feedback
  - learning
  peeked_transfer_at_freeze: false
  status: frozen_candidate_source_map
  construct_note: Schema-v5 five-construct annotations (population_transition_v5). Explicit risk removed
    from taxonomy. Fit on g5e50p30 G.1 (first-30 ordinals, 16k, trial-first).
