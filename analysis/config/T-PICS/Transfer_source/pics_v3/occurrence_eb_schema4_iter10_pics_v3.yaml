selector:
  name: occurrence_eb_schema4_iter10_pics_v3
  method: hierarchical_motif_occurrence_eb_cosine
  estimator: empirical_bayes_logit_random_intercept
  equation: logit(p_{d,j,e}) = alpha_e + b_{d,e}, b ~ N(0, tau_e^2)
  smoothing: Jeffreys p=(k+0.5)/(n+1); alpha=logit(overall Jeffreys)
  signature: invlogit(alpha_e + b_hat_{d,e}) per motif
  selection_rule: argmax cosine among six-source allowlist; self excluded; lexicographic
    source-id tie-break
  iteration_prefix: 1-10
  iteration_prefix_note: Full 10 source-population iterations frozen; structure_aware_v3
    / pics_v3_g1.
  schema_version: 4
  limited_data_protocol: structure_aware_v3
