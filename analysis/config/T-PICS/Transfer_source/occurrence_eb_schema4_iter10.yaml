# Frozen candidate-source map: schema-v4 occurrence-EB (iterations 1–10).
# Audit-passed; do not retune. Downstream accept/control gate is separate.
# Artifacts: analysis_2026Sep/mem/t_pics_source_pop10_schema_v4/source_selection_v4/
# Fit/eval job: 257756. peeked_transfer_at_freeze: false

selector:
  name: occurrence_eb_schema4_iter10
  method: hierarchical_motif_occurrence_eb_cosine
  estimator: empirical_bayes_logit_random_intercept
  equation: logit(p_{d,j,e}) = alpha_e + b_{d,e}, b ~ N(0, tau_e^2)
  smoothing: Jeffreys p=(k+0.5)/(n+1); alpha=logit(overall Jeffreys)
  signature: invlogit(alpha_e + b_hat_{d,e}) per motif
  selection_rule: argmax cosine among six-source allowlist; self excluded; lexicographic source-id tie-break
  iteration_prefix: 1-10
  iteration_prefix_note: Full 10 source-population iterations frozen; 1- and 5-iteration variants not supported.
  schema_version: 4
  motifs:
  - history
  - value
  - probability_used
  - feedback
  - learning
  - explicit_risk_mechanism
  peeked_transfer_at_freeze: false
  status: frozen_candidate_source_map
artifacts:
  root: analysis_2026Sep/mem/t_pics_source_pop10_schema_v4/source_selection_v4
