# Canonical TEH/PICS dataset names for EMNLP-10 + five-new (the 15).
#
# This is the name list for job names, tables, and submitters.
# CLI `--dataset` still uses `alias` (loaders / output folders). Do not
# rename bergert/guan/steyvers aliases — that would break paths.
# Slurm job names: t_<job_alias>  (e.g. t_1peterson2021using, t_20bergert).
#
# `analysis/config/ablation/config.yaml` is ablation *run paths* for the
# original 10, not this name registry. `config_fix_data_rerun1.yaml` is
# method-output paths for the EMNLP-10 compare table.
#
# Numeric prefixes 1–14 are the existing Psych-101 aliases (6 and 8/9 unused
# in the 15). Five-new externals had no number → start at 20.
# Schulz/Kool already have 13/14; do not renumber them.

datasets:
  # --- EMNLP-10 ---
  - id: 1
    alias: 1peterson2021using
    job_alias: 1peterson2021using
    display: Choice13k
    group: emnlp10
